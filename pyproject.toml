[project]
name = "bosflow"
version = "0.1.0"
description = "Synthetic background-oriented schlieren (BOS) data, displacement baselines, and flow-feature segmentation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Terry Zhou", email = "terrytanbozhou@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bosflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
