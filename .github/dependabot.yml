version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # roboflow 1.5.1 requires numpy<2.4; remove once the SDK relaxes that pin.
      - dependency-name: numpy
        versions: [">=2.4"]
    open-pull-requests-limit: 3
