# Regression gates for the displacement benchmark (scripts/check_metrics.py).
# Set from the full M2 run (100 scenes, results/m2) with margins for the 10-scene CI
# sample: error limits are 1.6x the full-run mean plus 0.005 px, peak-recovery floors
# are 0.8x the full-run mean. Tighten only with a new full run.
gates:
